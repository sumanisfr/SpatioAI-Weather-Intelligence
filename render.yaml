services:
  - type: web
    name: spatioai-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: INFERENCE_DEVICE
        value: cpu
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
